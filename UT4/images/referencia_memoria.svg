<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="100%" height="100%" style="background: white; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker solid brown -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <!-- Arrow marker dashed teal -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0891b2" />
    </marker>
    <!-- Filter for soft shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="940" height="470" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ================= LEFT: STACK / VARIABLE DE REFERÈNCIA ================= -->
  <!-- Memory Region Header: Stack -->
  <text x="215" y="42" fill="#475569" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="0.5">MEMÒRIA STACK</text>

  <!-- Dashed Ellipse around vendes & referencia -->
  <ellipse cx="215" cy="105" rx="170" ry="52" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- Label: vendes -->
  <text x="85" y="112" fill="#9a3412" font-size="22" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="600">vendes</text>

  <!-- Box: referencia -->
  <rect x="180" y="82" width="150" height="46" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" filter="url(#shadow)" />
  <text x="255" y="111" fill="#1e3a8a" font-size="19" font-style="italic" font-family="Georgia, serif" text-anchor="middle">referència</text>

  <!-- ================= RIGHT: HEAP / ELEMENTS DE L'ARRAY ================= -->
  <!-- Memory Region Header: Heap -->
  <text x="680" y="32" fill="#475569" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="0.5">MEMÒRIA HEAP</text>

  <!-- Dashed Ellipse around Array table and labels -->
  <ellipse cx="680" cy="185" rx="210" ry="142" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- Solid Arrow from referencia to Array Header -->
  <line x1="330" y1="105" x2="625" y2="105" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-solid)" />

  <!-- Array Table Group -->
  <g id="array-table" filter="url(#shadow)">
    <!-- Header: Array -->
    <rect x="635" y="88" width="130" height="34" fill="#f1f5f9" stroke="#1e3a8a" stroke-width="2" />
    <text x="700" y="111" fill="#1e3a8a" font-size="18" font-weight="bold" text-anchor="middle">Array</text>

    <!-- Row 0 -->
    <text x="620" y="146" fill="#9a3412" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="500" text-anchor="end">vendes[0]</text>
    <rect x="635" y="122" width="130" height="30" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="700" y="143" fill="#0f172a" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">0</text>

    <!-- Row 1 -->
    <text x="620" y="176" fill="#9a3412" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="500" text-anchor="end">vendes[1]</text>
    <rect x="635" y="152" width="130" height="30" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="700" y="173" fill="#0f172a" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">0</text>

    <!-- Row 2 -->
    <text x="620" y="206" fill="#9a3412" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="500" text-anchor="end">vendes[2]</text>
    <rect x="635" y="182" width="130" height="30" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="700" y="203" fill="#0f172a" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">0</text>

    <!-- Row 3 -->
    <text x="620" y="236" fill="#9a3412" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="500" text-anchor="end">vendes[3]</text>
    <rect x="635" y="212" width="130" height="30" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="700" y="233" fill="#0f172a" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">0</text>

    <!-- Row 4 -->
    <text x="620" y="266" fill="#9a3412" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="500" text-anchor="end">vendes[4]</text>
    <rect x="635" y="242" width="130" height="30" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="700" y="263" fill="#0f172a" font-size="17" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">0</text>
  </g>

  <!-- ================= BOTTOM: SENTÈNCIA JAVA ================= -->
  <!-- Cyan highlighted code box -->
  <g transform="translate(250, 390)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="48" rx="6" fill="#67e8f9" stroke="#0891b2" stroke-width="1.5" />
    <text x="220" y="31" fill="#083344" font-size="22" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-weight="bold" text-anchor="middle">int[] vendes = new int[5];</text>
  </g>

  <!-- ================= DASHED ARROWS FROM CODE ================= -->
  <!-- Arrow 1: From int[] vendes up to reference ellipse -->
  <path d="M 330 390 L 235 165" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" />

  <!-- Arrow 2: From new int[5]; up to array ellipse -->
  <path d="M 590 390 L 650 332" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" />
</svg>